  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

00 13px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">{{ authSubtitle }}<\u002Fdiv>\n    <sc-if value=\"{{ signupPending }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background:oklch(0.96 0.03 150);color:oklch(0.28 0.05 150);font:500 13px system-ui,sans-serif;padding:12px 14px;border-radius:11px\">Account created — check your email to confirm, then sign in.<\u002Fdiv>\n    <\u002Fsc-if>\n    <input type=\"email\" style=\"width:100%;box-sizing:border-box;padding:11px 13px;border:1px solid oklch(0.88 0.01 100);border-radius:10px;font:400 14px system-ui,sans-serif;background:#fff\" placeholder=\"you@email.com\" value=\"{{ authEmail }}\" sc-camel-on-change=\"{{ onAuthEmailChange }}\">\n    <input type=\"password\" style=\"width:100%;box-sizing:border-box;padding:11px 13px;border:1px solid oklch(0.88 0.01 100);border-radius:10px;font:400 14px system-ui,sans-serif;background:#fff\" placeholder=\"Password\" value=\"{{ authPassword }}\" sc-camel-on-change=\"{{ onAuthPasswordChange }}\">\n    <sc-if value=\"{{ isSignupMode }}\" hint-placeholder-val=\"{{ false }}\">\n      <input type=\"password\" style=\"width:100%;box-sizing:border-box;padding:11px 13px;border:1px solid oklch(0.88 0.01 100);border-radius:10px;font:400 14px system-ui,sans-serif;background:#fff\" placeholder=\"Confirm password\" value=\"{{ authPasswordConfirm }}\" sc-camel-on-change=\"{{ onAuthPasswordConfirmChange }}\">\n    <\u002Fsc-if>\n    <sc-if value=\"{{ hasAuthError }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"color:oklch(0.55 0.15 30);font:500 12px system-ui,sans-serif\">{{ authError }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <button style=\"width:100%;box-sizing:border-box;border:none;background:oklch(0.28 0.05 150);color:oklch(0.98 0.005 100);font:700 14px system-ui,sans-serif;padding:13px;border-radius:11px;cursor:pointer\" sc-camel-on-click=\"{{ submitAuth }}\">{{ authSubmitLabel }}<\u002Fbutton>\n    <button style=\"border:none;background:none;color:oklch(0.5 0.02 150);font:600 12px system-ui,sans-serif;cursor:pointer;text-align:center\" sc-camel-on-click=\"{{ toggleAuthMode }}\">{{ authToggleLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLoggedIn }}\" hint-placeholder-val=\"{{ true }}\">\n\n  <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;flex-direction:column;gap:16px;animation:fadein .25s ease\">\n    <div style=\"position:relative;width:100%;height:min(58vh,420px);flex:none\">\n      <img src=\"3c58bbcb-f17b-4da6-baed-a4722cc89dfc\" alt=\"Golf course at sunrise\" style=\"width:100%;height:100%;object-fit:cover;display:block\">\n      <div style=\"position:absolute;inset:0;background:linear-gradient(to top,rgba(15,25,18,.85),rgba(15,25,18,.05) 45%,rgba(15,25,18,0) 65%)\"><\u002Fdiv>\n      <div style=\"position:absolute;left:20px;right:20px;bottom:18px\">\n        <div style=\"color:#fff;font:700 24px system-ui,sans-serif;text-shadow:0 1px 6px rgba(0,0,0,.35);margin-bottom:12px\">Ready for today's round?<\u002Fdiv>\n        <button style=\"width:100%;box-sizing:border-box;border:none;background:oklch(0.98 0.005 100);color:oklch(0.2 0.045 150);font:700 15px system-ui,sans-serif;padding:15px;border-radius:14px;cursor:pointer\" sc-camel-on-click=\"{{ startSetup }}\">+ Start New Round<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:0 20px 20px;display:flex;flex-direction:column;gap:16px\">\n\n    <sc-if value=\"{{ hasRounds }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;flex-direction:column;gap:16px\">\n\n      <div style=\"background:oklch(0.28 0.05 150);border-radius:16px;padding:18px 20px;color:oklch(0.98 0.005 100)\">\n        <div style=\"font:600 11px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;opacity:.7\">Most recent round<\u002Fdiv>\n        <div style=\"font:600 14px system-ui,sans-serif;margin-top:8px\">{{ lastRound.courseName }} · {{ lastRound.teeName }}<\u002Fdiv>\n        <div style=\"display:flex;align-items:baseline;gap:10px;margin-top:8px\">\n          <div style=\"font:700 40px system-ui,sans-serif\">{{ lastRound.summary.score }}<\u002Fdiv>\n          <div style=\"font:600 14px system-ui,sans-serif;color:oklch(0.8 0.11 80)\">{{ lastRound.toParLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font:500 11px system-ui,sans-serif;opacity:.65;margin-top:4px\">{{ lastRound.holesLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid oklch(0.9 0.01 100);border-radius:16px;padding:18px 20px\">\n        <div style=\"font:700 14px system-ui,sans-serif;margin-bottom:2px\">Focus areas<\u002Fdiv>\n        <div style=\"font:400 12px system-ui,sans-serif;color:oklch(0.5 0.02 150);margin-bottom:14px\">Avg strokes lost per round, ranked<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <sc-for list=\"{{ aggRanked }}\" as=\"cat\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;align-items:center;gap:10px\">\n              <div style=\"width:18px;font:700 12px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">{{ cat.rank }}<\u002Fdiv>\n              <div style=\"width:96px;font:600 13px system-ui,sans-serif\">{{ cat.label }}<\u002Fdiv>\n              <div style=\"flex:1;height:7px;background:oklch(0.93 0.01 100);border-radius:4px;overflow:hidden\"><div style=\"height:100%;background:oklch(0.55 0.1 150);width:{{ cat.pct }}%\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"width:32px;text-align:right;font:700 13px system-ui,sans-serif\">{{ cat.valueLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff;border:1px solid oklch(0.9 0.01 100);border-radius:16px;padding:18px 20px\">\n        <div style=\"font:700 14px system-ui,sans-serif;margin-bottom:12px\">Score trend<\u002Fdiv>\n        <svg width=\"100%\" height=\"60\" sc-camel-view-box=\"0 0 300 60\" sc-camel-preserve-aspect-ratio=\"none\">\n          <polyline points=\"{{ sparklinePoints }}\" fill=\"none\" stroke=\"oklch(0.55 0.1 150)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n        <\u002Fsvg>\n        <div style=\"display:flex;justify-content:space-between;font:500 11px system-ui,sans-serif;color:oklch(0.5 0.02 150);margin-top:4px\"><span>{{ trendOldestLabel }}<\u002Fspan><span>{{ trendNewestLabel }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <div style=\"font:700 14px system-ui,sans-serif;margin-bottom:10px\">Recent rounds<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ recentRounds }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid oklch(0.9 0.01 100);border-radius:12px;padding:12px 14px;cursor:pointer\" sc-camel-on-click=\"{{ r.open }}\">\n              <div><div style=\"font:600 13px system-ui,sans-serif\">{{ r.courseName }}<\u002Fdiv><div style=\"font:400 11px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">{{ r.dateLabel }}<\u002Fdiv><\u002Fdiv>\n              <div style=\"text-align:right\"><div style=\"font:700 16px system-ui,sans-serif\">{{ r.score }}<\u002Fdiv><div style=\"font:600 11px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">{{ r.toParLabel }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ noRounds }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:40px 10px;color:oklch(0.5 0.02 150)\">\n        <div style=\"font:600 15px system-ui,sans-serif;color:oklch(0.28 0.05 150);margin-bottom:6px\">No rounds logged yet<\u002Fdiv>\n        <div style=\"font:400 13px system-ui,sans-serif\">Start a round to see your stats here.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHistory }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:20px;animation:fadein .25s ease\">\n    <div style=\"font:700 17px system-ui,sans-serif;margin-bottom:14px\">Round History<\u002Fdiv>\n    <sc-if value=\"{{ noRounds }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"text-align:center;padding:30px 10px;color:oklch(0.5 0.02 150);font:400 13px system-ui,sans-serif\">No rounds saved yet.<\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <sc-for list=\"{{ allRoundsDesc }}\" as=\"r\" hint-placeholder-count=\"4\">\n        <div style=\"background:#fff;border:1px solid oklch(0.9 0.01 100);border-radius:12px;padding:13px 15px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:baseline;cursor:pointer\" sc-camel-on-click=\"{{ r.open }}\">\n            <div style=\"font:600 14px system-ui,sans-serif\">{{ r.courseName }}<\u002Fdiv>\n            <div style=\"font:700 16px system-ui,sans-serif\">{{ r.score }} <span style=\"font:600 12px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">{{ r.toParLabel }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;margin-top:4px;font:400 11px system-ui,sans-serif;color:oklch(0.5 0.02 150);cursor:pointer\" sc-camel-on-click=\"{{ r.open }}\">\n            <span>{{ r.teeName }} · {{ r.dateLabel }}<\u002Fspan>\n            <span>{{ r.puttsLabel }} putts · {{ r.girLabel }} GIR<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:flex-end;margin-top:8px\">\n            <button style=\"border:none;background:none;color:oklch(0.6 0.03 30);font:600 11px system-ui,sans-serif;cursor:pointer;padding:2px 4px\" sc-camel-on-click=\"{{ r.deleteRound }}\">Delete round<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isStats }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:20px;display:flex;flex-direction:column;gap:16px;animation:fadein .25s ease\">\n    <sc-if value=\"{{ statsNoData }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"text-align:center;padding:6px 10px 4px;color:oklch(0.5 0.02 150);font:400 12px system-ui,sans-serif\">No rounds logged yet — layout shown with sample zeros. Log a round to see real trends.<\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"background:oklch(0.95 0.025 150);border-radius:18px;padding:18px 18px 20px\">\n      <div style=\"font:700 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.4 0.05 150);opacity:.75;margin-bottom:16px\">Tee to Green<\u002Fdiv>\n\n      <div style=\"display:flex;gap:18px;align-items:center;margin-bottom:14px\">\n        <div style=\"width:110px;height:110px;border-radius:50%;background:{{ stats.fairwayGaugeBg }};display:grid;place-items:center;flex:none\">\n          <div style=\"width:80px;height:80px;border-radius:50%;background:#fdfdfb;display:flex;flex-direction:column;align-items:center;justify-content:center\">\n            <div style=\"font:700 22px system-ui,sans-serif\">{{ stats.fairwayPctLabel }}<\u002Fdiv>\n            <div style=\"font:500 9px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">FAIRWAYS<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1\">\n          <div style=\"font:600 12px system-ui,sans-serif;margin-bottom:6px\">Fairways Hit<\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-end;gap:4px;height:44px\">\n            <sc-for list=\"{{ stats.fairwayTrend }}\" as=\"b\" hint-placeholder-count=\"6\">\n              <div style=\"flex:1;height:{{ b.h }}%;background:oklch(0.6 0.09 150);border-radius:3px;min-height:3px\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font:400 10px system-ui,sans-serif;color:oklch(0.5 0.02 150);margin-top:4px\">last rounds<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:5px;margin-top:6px;font:600 10.5px system-ui,sans-serif;color:{{ stats.fairwayTrendInfo.color }}\"><span>{{ stats.fairwayTrendInfo.arrow }}<\u002Fspan><span>{{ stats.fairwayTrendInfo.text }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-bottom:6px\">\n        <div style=\"display:flex;justify-content:space-between;font:600 12px system-ui,sans-serif;margin-bottom:6px\"><span>Greens in Regulation<\u002Fspan><span>{{ stats.girPctLabel }}<\u002Fspan><\u002Fdiv>\n        <div style=\"height:14px;background:oklch(0.99 0.005 150);border-radius:7px;overflow:hidden\"><div style=\"height:100%;width:{{ stats.girPct }}%;background:oklch(0.55 0.1 150);border-radius:7px\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;gap:3px;margin-top:6px;height:20px\">\n          <sc-for list=\"{{ stats.girTrend }}\" as=\"b2\" hint-placeholder-count=\"6\">\n            <div style=\"flex:1;align-self:flex-end;height:{{ b2.h }}%;background:oklch(0.75 0.06 150);border-radius:2px;min-height:3px\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:5px;margin-top:6px;font:600 10.5px system-ui,sans-serif;color:{{ stats.girTrendInfo.color }}\"><span>{{ stats.girTrendInfo.arrow }}<\u002Fspan><span>{{ stats.girTrendInfo.text }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px\">\n        <div style=\"background:#fdfdfb;border-radius:11px;padding:11px 12px\">\n          <div style=\"font:600 11px system-ui,sans-serif;margin-bottom:8px\">Missed Fairways<\u002Fdiv>\n          <div style=\"display:flex;height:10px;border-radius:5px;overflow:hidden;background:oklch(0.93 0.01 150)\">\n            <div style=\"width:{{ stats.fwLeftPct }}%;background:oklch(0.55 0.1 150)\"><\u002Fdiv>\n            <div style=\"width:{{ stats.fwRightPct }}%;background:oklch(0.7 0.09 150)\"><\u002Fdiv>\n            <div style=\"width:{{ stats.fwShortPct }}%;background:oklch(0.85 0.05 150)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;font:400 10px system-ui,sans-serif;color:oklch(0.5 0.02 150);margin-top:6px\"><span>L {{ stats.fwLeft }}<\u002Fspan><span>R {{ stats.fwRight }}<\u002Fspan><span>Short {{ stats.fwShort }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fdfdfb;border-radius:11px;padding:11px 12px\">\n          <div style=\"font:600 11px system-ui,sans-serif;margin-bottom:8px\">Missed Greens<\u002Fdiv>\n          <div style=\"display:flex;height:10px;border-radius:5px;overflow:hidden;background:oklch(0.93 0.01 150)\">\n            <div style=\"width:{{ stats.gLeftPct }}%;background:oklch(0.55 0.1 150)\"><\u002Fdiv>\n            <div style=\"width:{{ stats.gRightPct }}%;background:oklch(0.7 0.09 150)\"><\u002Fdiv>\n            <div style=\"width:{{ stats.gLongPct }}%;background:oklch(0.85 0.05 150)\"><\u002Fdiv>\n            <div style=\"width:{{ stats.gShortPct }}%;background:oklch(0.93 0.02 150)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;font:400 9px system-ui,sans-serif;color:oklch(0.5 0.02 150);margin-top:6px;flex-wrap:wrap;gap:2px\"><span>L {{ stats.gLeft }}<\u002Fspan><span>R {{ stats.gRight }}<\u002Fspan><span>Lg {{ stats.gLong }}<\u002Fspan><span>Sh {{ stats.gShort }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:oklch(0.96 0.035 80);border-radius:18px;padding:18px 18px 20px\">\n      <div style=\"font:700 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:oklch(0.45 0.08 80);opacity:.8;margin-bottom:16px\">Putting<\u002Fdiv>\n      <div style=\"dis eholder-val=\"{{ false }}\">\n  <div style=\"padding:20px;display:flex;flex-direction:column;gap:22px;animation:fadein .25s ease\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid oklch(0.9 0.01 100);border-radius:12px;padding:12px 14px\">\n      <div style=\"font:500 12px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">Signed in as<br><span style=\"font:600 13px system-ui,sans-serif;color:oklch(0.22 0.02 150)\">{{ userEmail }}<\u002Fspan><\u002Fdiv>\n      <button style=\"border:none;background:none;color:oklch(0.55 0.08 30);font:600 12px system-ui,sans-serif;cursor:pointer\" sc-camel-on-click=\"{{ logout }}\">Log out<\u002Fbutton>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font:700 15px system-ui,sans-serif;margin-bottom:2px\">Your Clubs<\u002Fdiv>\n      <div style=\"font:400 12px system-ui,sans-serif;color:oklch(0.5 0.02 150);margin-bottom:10px\">Shown in the tee/approach dropdowns during a round<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:10px\">\n        <sc-for list=\"{{ clubRows }}\" as=\"cr\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid oklch(0.9 0.01 100);border-radius:9px;padding:9px 12px\">\n            <span style=\"font:500 13px system-ui,sans-serif\">{{ cr.name }}<\u002Fspan>\n            <button style=\"border:none;background:none;color:oklch(0.55 0.02 150);font:600 12px system-ui,sans-serif;cursor:pointer\" sc-camel-on-click=\"{{ cr.remove }}\">Remove<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:8px\">\n        <input style=\"flex:1;box-sizing:border-box;padding:9px 11px;border:1px solid oklch(0.88 0.01 100);border-radius:9px;font:400 13px system-ui,sans-serif;background:#fff\" placeholder=\"Add a club…\" value=\"{{ newClubName }}\" sc-camel-on-change=\"{{ onNewClubChange }}\">\n        <button style=\"border:none;background:oklch(0.28 0.05 150);color:oklch(0.98 0.005 100);font:600 13px system-ui,sans-serif;padding:0 16px;border-radius:9px;cursor:pointer\" sc-camel-on-click=\"{{ addClub }}\">Add<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font:700 15px system-ui,sans-serif;margin-bottom:2px\">Club Distances<\u002Fdiv>\n      <div style=\"font:400 12px system-ui,sans-serif;color:oklch(0.5 0.02 150);margin-bottom:10px\">Record your average carry distance per club<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <sc-for list=\"{{ distanceRows }}\" as=\"dr\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid oklch(0.9 0.01 100);border-radius:9px;padding:9px 12px\">\n            <span style=\"font:500 13px system-ui,sans-serif\">{{ dr.name }}<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:6px\">\n              <input type=\"number\" style=\"width:64px;box-sizing:border-box;padding:6px 8px;border:1px solid oklch(0.88 0.01 100);border-radius:7px;font:500 13px system-ui,sans-serif;text-align:right\" value=\"{{ dr.yards }}\" sc-camel-on-change=\"{{ dr.setYards }}\">\n              <span style=\"font:500 12px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">yds<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <div style=\"font:700 15px system-ui,sans-serif;margin-bottom:2px\">Wedge Matrix<\u002Fdiv>\n      <div style=\"font:400 12px system-ui,sans-serif;color:oklch(0.5 0.02 150);margin-bottom:12px\">Track carry distance by swing length for each wedge — the same club can go different distances depending on the swing<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <sc-for list=\"{{ wedgeCards }}\" as=\"w\" hint-placeholder-count=\"2\">\n          <div style=\"background:#fff;border:1px solid oklch(0.9 0.01 100);border-radius:14px;padding:14px 16px\">\n            <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:10px\">\n              <input style=\"flex:1;box-sizing:border-box;padding:7px 10px;border:1px solid oklch(0.88 0.01 100);border-radius:8px;font:700 13px system-ui,sans-serif\" value=\"{{ w.name }}\" sc-camel-on-change=\"{{ w.setName }}\">\n              <button style=\"border:none;background:none;color:oklch(0.55 0.02 150);font:600 12px system-ui,sans-serif;cursor:pointer\" sc-camel-on-click=\"{{ w.remove }}\">Remove wedge<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:8px\">\n              <sc-for list=\"{{ w.rows }}\" as=\"row\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:6px\">\n                  <input style=\"flex:1;box-sizing:border-box;padding:7px 9px;border:1px solid oklch(0.88 0.01 100);border-radius:7px;font:400 12px system-ui,sans-serif\" value=\"{{ row.label }}\" sc-camel-on-change=\"{{ row.setLabel }}\">\n                  <input type=\"number\" style=\"width:56px;box-sizing:border-box;padding:7px 6px;border:1px solid oklch(0.88 0.01 100);border-radius:7px;font:500 12px system-ui,sans-serif;text-align:right\" value=\"{{ row.yards }}\" sc-camel-on-change=\"{{ row.setYards }}\">\n                  <span style=\"font:500 11px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">yds<\u002Fspan>\n                  <button style=\"border:none;background:none;color:oklch(0.6 0.02 150);font:600 15px system-ui,sans-serif;cursor:pointer;padding:0 4px\" sc-camel-on-click=\"{{ row.remove }}\">×<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <button style=\"border:none;background:oklch(0.96 0.03 150);color:oklch(0.28 0.05 150);font:600 12px system-ui,sans-serif;padding:7px 12px;border-radius:8px;cursor:pointer\" sc-camel-on-click=\"{{ w.addRow }}\">+ Add swing<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <sc-if value=\"{{ canAddWedge }}\" hint-placeholder-val=\"{{ true }}\">\n        <button style=\"width:100%;box-sizing:border-box;margin-top:12px;border:1px dashed oklch(0.75 0.02 150);background:none;color:oklch(0.28 0.05 150);font:600 13px system-ui,sans-serif;padding:11px;border-radius:10px;cursor:pointer\" sc-camel-on-click=\"{{ addWedge }}\">+ Add wedge (up to 4)<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isNotes }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"padding:20px;display:flex;flex-direction:column;gap:16px;animation:fadein .25s ease\">\n    <div>\n      <div style=\"font:700 15px system-ui,sans-serif;margin-bottom:2px\">Swing Keys &amp; Notes<\u002Fdiv>\n      <div style=\"font:400 12px system-ui,sans-serif;color:oklch(0.5 0.02 150);margin-bottom:10px\">Jot down swing thoughts, drills, or anything to remember<\u002Fdiv>\n      <input style=\"width:100%;box-sizing:border-box;padding:11px 13px;border:1px solid oklch(0.88 0.01 100);border-radius:10px;font:600 13px system-ui,sans-serif;background:#fff;margin-bottom:8px\" placeholder=\"Title (e.g. Driver takeaway)\" value=\"{{ notesTitleDraft }}\" sc-camel-on-change=\"{{ onNotesTitleChange }}\">\n      <sc-if value=\"{{ hasAuthError }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"color:oklch(0.55 0.15 30);font:500 12px system-ui,sans-serif;margin-bottom:8px\">{{ authError }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <textarea style=\"width:100%;box-sizing:border-box;min-height:100px;padding:11px 13px;border:1px solid oklch(0.88 0.01 100);border-radius:10px;font:400 14px system-ui,sans-serif;background:#fff;resize:vertical\" placeholder=\"Type a note…\" value=\"{{ notesDraft }}\" sc-camel-on-change=\"{{ onNotesDraftChange }}\"><\u002Ftextarea>\n      <button style=\"width:100%;box-sizing:border-box;margin-top:10px;border:none;background:{{ saveNoteBg }};color:oklch(0.98 0.005 100);font:700 14px system-ui,sans-serif;padding:12px;border-radius:11px;cursor:pointer\" sc-camel-on-click=\"{{ saveNote }}\" disabled=\"{{ saveNoteDisabled }}\">{{ saveNoteBtnLabel }}<\u002Fbutton>\n      <sc-if value=\"{{ isEditingNote }}\" hint-placeholder-val=\"{{ false }}\">\n        <button style=\"width:100%;box-sizing:border-box;margin-top:8px;border:1px solid oklch(0.88 0.01 100);background:#fff;color:oklch(0.5 0.02 150);font:600 13px system-ui,sans-serif;padding:10px;border-radius:11px;cursor:pointer\" sc-camel-on-click=\"{{ cancelEditNote }}\">Cancel edit<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px\">\n      <sc-for list=\"{{ savedNotes }}\" as=\"note\" hint-placeholder-count=\"3\">\n        <div style=\"background:#fff;border:1px solid oklch(0.9 0.01 100);border-radius:12px;padding:13px 15px\">\n          <sc-if value=\"{{ note.hasTitle }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:700 13px system-ui,sans-serif;margin-bottom:4px\">{{ note.title }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"font:400 13px/1.5 system-ui,sans-serif;white-space:pre-wrap\">{{ note.text }}<\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:8px\">\n            <div style=\"font:400 11px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">{{ note.dateLabel }}<\u002Fdiv>\n            <div style=\"display:flex;gap:12px\">\n              <button style=\"border:none;background:none;color:oklch(0.28 0.05 150);font:600 11px system-ui,sans-serif;cursor:pointer\" sc-camel-on-click=\"{{ note.edit }}\">Edit<\u002Fbutton>\n              <button style=\"border:none;background:none;color:oklch(0.55 0.02 150);font:600 11px system-ui,sans-serif;cursor:pointer\" sc-camel-on-click=\"{{ note.r xt-transform:uppercase;margin-bottom:8px\">Choose tees<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ teeOptions }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:12px;background:{{ t.bg }};border:1px solid {{ t.border }};border-radius:12px;padding:12px 16px;cursor:pointer\" sc-camel-on-click=\"{{ t.select }}\">\n              <div style=\"width:14px;height:14px;border-radius:50%;background:{{ t.dotColor }};flex:none\"><\u002Fdiv>\n              <div style=\"flex:1\"><div style=\"font:600 13px system-ui,sans-serif\">{{ t.name }}<\u002Fdiv><div style=\"font:400 11px system-ui,sans-serif;color:oklch(0.5 0.02 150)\">{{ t.yardage }} yds · Rating {{ t.rating }} · Slope {{ t.slope }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font:600 12px system-ui,sans-serif;color:oklch(0.5 0.02 150);letter-spacing:.05em;text-transform:uppercase;margin:16px 0 8px\">Round length<\u002Fdiv>\n        <div style=\"display:flex;gap:8px\">\n          <button style=\"flex:1;border:1px solid oklch(0.85 0.01 100);background:{{ hc18Bg }};color:{{ hc18Color }};font:600 12px system-ui,sans-serif;padding:9px 4px;border-radius:9px;cursor:pointer\" sc-camel-on-click=\"{{ setHc18 }}\">18 holes<\u002Fbutton>\n          <button style=\"flex:1;border:1px solid oklch(0.85 0.01 100);background:{{ hcF9Bg }};color:{{ hcF9Color }};font:600 12px system-ui,sans-serif;padding:9px 4px;border-radius:9px;cursor:pointer\" sc-camel-on-click=\"{{ setHcF9 }}\">Front 9<\u002Fbutton>\n          <button style=\"flex:1;border:1px solid oklch(0.85 0.01 100);background:{{ hcB9Bg }};color:{{ hcB9Color }};font:600 12px system-ui,sans-serif;padding:9px 4px;border-radius:9px;cursor:pointer\" sc-camel-on-click=\"{{ setHcB9 }}\">Back 9<\u002Fbutton>\n        <\u002Fdiv>\n        <button style=\"width:100%;box-sizing:border-box;margin-top:18px;bo    <sc-if value=\"{{ showFairway }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"background:#fff;border:1px solid oklch(0.9 0.01 100);border-radius:14px;padding:16px\">\n        <div style=\"font:600 12px system-ui,sans-serif;color:oklch(0.5 0.02 150);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px\">Off the tee<\u002Fdiv>\n        <sc-raw-select style=\"width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid oklch(0.88 0.01 100);border-radius:8px;font:400 13px system-ui,sans-serif;background:#fff;margin-bottom:12px\" value=\"{{ cur.clubTee }}\" sc-camel-on-change=\"{{ setClubTee }}\">\n          <option value=\"\">Club used…<\u002Foption>\n          <sc-for list=\"{{ clubs }}\" as=\"club\" hint-placeholder-count=\"5\"><option value=\"{{ club }}\">{{ club }}<\u002Foption><\u002Fsc-for>\n        <\u002Fsc-raw-select>\n        <div style=\"display:flex;gap:8px\">\n          <button style=\"flex:1;border:1px solid oklch(0.85 0.01 100);background:{{ fwHitBg }};color:{{ fwHitColor }};font:600 13px system-ui,sans-serif;padding:10px 6px;border-radius:9px;cursor:pointer\" sc-camel-on-click=\"{{ setFairwayHit }}\">Fairway hit<\u002Fbutton>\n          <button style=\"flex:1;border:1px solid oklch(0.85 0.01 100);background:{{ fwMissBg }};color:{{ fwMissColor }};font:600 13px system-ui,sans-serif;padding:10px 6px;border-radius:9px;cursor:pointer\" sc-camel-on-click=\"{{ setFairwayMissMode }}\">Missed<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showFairwayMiss }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;gap:8px;margin-top:8px\">\n          <button style=\"flex:1;border:1px solid oklch(0.85 0.01 100);background:{{ fwmLeftBg }};color:{{ fwmLeftColor }};font:600 12px system-ui,sans-serif;padding:8px 4px;border-radius:8px;cursor:pointer\" sc-camel-on-click=\"{{ setFwMissLeft }}\">Left<\u002Fbutton>\n          <button style=\"flex:1;border:1px solid oklch(0.85 0.01 100);background:{{ fwmRigh padding:9px 6px calc(9px + env(safe-area-inset-bottom, 0px))\">\n    <button style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;padding:6px 2px;cursor:pointer\" sc-camel-on-click=\"{{ goDashboard }}\">\n      <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ navHomeColor }}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11l9-8 9 8\"><\u002Fpath><path d=\"M5 10v10h14V10\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font:600 10.5px system-ui,sans-serif;color:{{ navHomeColor }}\">Home<\u002Fspan>\n    <\u002Fbutton>\n    <button style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;padding:6px 2px;cursor:pointer\" sc-camel-on-click=\"{{ goHistory }}\">\n      <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ navHistoryColor }}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 7v5l3 3\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font:600 10.5px system-ui,sans-serif;color:{{ navHistoryColor }}\">History<\u002Fspan>\n    <\u002Fbutton>\n    <button style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;padding:6px 2px;cursor:pointer\" sc-camel-on-click=\"{{ goStats }}\">\n      <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ navStatsColor }}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20V10\"><\u002Fpath><path d=\"M12 20V4\"><\u002Fpath><path d=\"M20 20v-7\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font:600 10.5px system-ui,sans-serif;color:{{ navStatsColor }}\">Stats<\u002Fspan>\n    <\u002Fbutton>\n    <button style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;padding:6px 2px;cursor:pointer\" sc-camel-on-click=\"{{ goSettings }}\">\n      <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ navSettingsColor }}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font:600 10.5px system-ui,sans-serif;color:{{ navSettingsColor }}\">Settings<\u002Fspan>\n    <\u002Fbutton>\n    <button style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;padding:6px 2px;cursor:pointer\" sc-camel-on-click=\"{{ goNotes }}\">\n      <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"{{ navNotesColor }}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 4h16v13l-4 4H4z\"><\u002Fpath><path d=\"M9 9h6M9 13h4\"><\u002Fpath><\u002Fsvg>\n      <span style=\"font:600 10.5px system-ui,sans-serif;color:{{ navNotesColor }}\">Notes<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CLUBS = ['Driver','3-Wood','5-Wood','3-Hybrid','4-Iron','5-Iron','6-Iron','7-Iron','8-Iron','9-Iron','PW','GW','SW','LW'];\nconst GOLF_API_BASE = 'https://api.golfcourseapi.com';\nconst GOLF_API_KEY = 'W2LDV2ZI6MMIUUDRU5JMVV7P3E';\nconst TEE_DOT_COLORS = ['oklch(0.5 0.13 250)', 'oklch(0.9 0 0)', 'oklch(0.55 0.18 25)', 'oklch(0.6 0.15 145)', 'oklch(0.7 0.14 90)', 'oklch(0.4 0.02 250)'];\nasync function golfApiFetch(path) {\n  const res = await fetch(GOLF_API_BASE + path, { headers: { Authorization: 'Key ' + GOLF_API_KEY } });\n  if (!res.ok) throw new Error('GolfCourseAPI error (' + res.status + ')');\n  return res.json();\n}\nfunction fallbackHoles(parTotal, numHoles) {\n  const n = numHoles || 18;\n  const par = Math.round((parTotal || 72) / n);\n  return Array.from({ length: n }, (_, i) => ({ number: i + 1, par, yardage: par === 3 ? 160 : par === 4 ? 390 : 520 }));\n}\nfunction mapTee(t, idx) {\n  const holes = Array.isArray(t.holes) && t.holes.length\n    ? t.holes.map((h, i) => ({ number: i + 1, par: h.par || 4, yardage: h.yardage || h.length || 0 }))\n    : fallbackHoles(t.par_total, t.number_of_holes);\n  return {\n    name: t.tee_name || ('Tee ' + (idx + 1)),\n    dotColor: TEE_DOT_COLORS[idx % TEE_DOT_COLORS.length],\n    rating: t.course_rating ?? '—', slope: t.slope_rating ?? '—',\n    holes\n  };\n}\nconst SUPABASE_URL = 'https://jhcvyebqsdmhseytvrws.supabase.co';\nconst SUPABASE_ANON_KEY = 'sb_publishable_vGRgWlWfyei1lJ6A_r82jA_57iLfLDK';\nlet uidCounter = 1;\nfunction uid() { return 'id' + (uidCounter++) + '-' + Date.now().toString(36); }\nfunction defaultSettings() {\n  return {\n    clubs: [...CLUBS],\n    clubDistances: {},\n    wedges: [\n      { id: uid(), name: '60°', rows: [\n        { id: uid(), label: '⅓ swing (pregnant pause, slow accel)', yards: 20 },\n        { id: uid(), label: '⅓ swing', yards: 30 },\n        { id: uid(), label: '⅔ swing', yards: 50 },\n        { id: uid(), label: 'Full swing', yards: 80 }\n      ] }\n    ]\n  };\n}\n\nfunction makeHole(h) {\n  return { number: h.number, par: h.par, yardage: h.yardage, score: h.par,\n    fairway: null, fairwayMiss: null, gir: null, girMiss: null,\n    inSand: false, scrambleSuccess: null, putts: 2, penalties: 0,\n    birdieChance: false, clubTee: '', clubApproach: '',\n    secondShotFairway: null, secondShotMiss: null, secondShotSand: false,\n    skipped: false };\n}\n\nclass Component extends DCLogic {\n  state = {\n    view: 'dashboard', rounds: [], courseQuery: '',\n    apiCourses: [], apiSearchLoading: false, apiSearchError: '',\n    selectedCourseId: null, selectedCourseFull: null, courseDetailLoading: false, courseDetailError: '',\n    selectedTee: null, holeCountMode: '18',\n    round: null, viewingRoundId: null, editingRoundId: null,\n    ...defaultSettings(), newClubName: '',\n    notes: [], notesDraft: '', notesTitleDraft: '', editingNoteId: null,\n    session: null, authLoading: true, authEmail: '', authPassword: '', authPasswordConfirm: '', authMode: 'signin', signupPending: false, authError: '', settingsRowId: null\n  };\n\n  waitForSupabaseLib(timeoutMs) {\n    return new Promise((resolve, reject) => {\n      const started = Date.now();\n      const check = () => {\n        if (window.supabase && window.supabase.createClient) return resolve();\n        if (Date.now() - started > timeoutMs) return reject(new Error('Supabase library failed to load'));\n        setTimeout(check, 50);\n      };\n      check();\n    });\n  }\n\n  async componentDidMount() {\n    try {\n      await this.waitForSupabaseLib(10000);\n    } catch (e) {\n      this.setState({ authLoading: false, authError: 'Could not load the login system. Please refresh the page.' });\n      return;\n    }\n    this.supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);\n    this.supabase.auth.getSession().then(({ data }) => {\n      this.setState({ session: data.session, authLoading: false });\n      if (data.session) this.loadUserData(data.session.user.id);\n    }).catch(() => this.setState({ authLoading: false }));\n    this.supabase.auth.onAuthStateChange((event, session) => {\n      this.setState({ session, authLoading: false });\n      if (session) this.loadUserData(session.user.id);\n      else this.setState({ rounds: [], notes: [], ...defaultSettings(), settingsRowId: null });\n    });\n  }\n\n  async loadUserData(uid) {\n    let roundRows, noteRows, settingRows;\n    try {\n      const results = await Promise.all([\n        this.supabase.from('rounds').select('*').eq('user_id', uid).order('date'),\n        this.supabase.from('notes').select('*').eq('user_id', uid).order('date', { ascending: false }),\n        this.supabase.from('settings').select('*').eq('user_id', uid).limit(1)\n      ]);\n      roundRows = results[0].data; noteRows = results[1].data; settingRows = results[2].data;\n    } catch (e) {\n      this.setState({ authError: 'Could not load your data. Please refresh.' });\n      return;\n    }\n    const rounds = (roundRows || []).map(r => ({ id: r.id, courseName: r.course_name, teeName: r.tee_name, date: r.date, holes: r.holes }));\n    const notes = (noteRows || []).map(n => ({ id: n.id, title: n.title, text: n.text, date: n.date }));\n    this.userId = uid;\n    let settingsRow = settingRows && settingRows[0];\n    if (!settingsRow) {\n      const def = defaultSettings();\n      try {\n        const { data: inserted, error } = await this.supabase.from('settings').insert({ user_id: uid, clubs: def.clubs, club_distances: def.clubDistances, wedges: def.wedges }).select().single();\n        if (error) throw error;\n        settingsRow = inserted;\n      } catch (e) {\n        console.error('Could not create settings row', e);\n        settingsRow = null;\n      }\n    }\n    this.setState({\n      rounds, notes,\n      clubs: settingsRow ? (settingsRow.clubs || defaultSettings().clubs) : defaultSettings().clubs,\n      clubDistances: settingsRow ? (settingsRow.club_distances || {}) : {},\n      wedges: settingsRow ? (settingsRow.wedges || defaultSettings().wedges) : defaultSettings().wedges,\n      settingsRowId: settingsRow ? settingsRow.id : null\n    });\n  }\n\n  onAuthEmailChange = (e) => this.setState({ authEmail: e.target.value, authError: '' });\n  onAuthPasswordChange = (e) => this.setState({ authPassword: e.target.value, authError: '' });\n  onAuthPasswordConfirmChange = (e) => this.setState({ authPasswordConfirm: e.target.value, authError: '' });\n  toggleAuthMode = () => this.setState(s => ({ authMode: s.authMode === 'signin' ? 'signup' : 'signin', authError: '', signupPending: false, authPassword: '', authPasswordConfirm: '' }));\n  submitAuth = () => {\n    const email = this.state.authEmail.trim();\n    const password = this.state.authPassword;\n    if (!email || !password) return;\n    if (this.state.authMode === 'signup') {\n      if (password !== this.state.authPasswordConfirm) {\n        this.setState({ authError: \"Passwords don't match.\" });\n        return;\n      }\n      this.supabase.auth.signUp({ email, password }).then(({ data, error }) => {\n        if (error) this.setState({ authError: error.message });\n        else if (data.session) this.setState({ authError: '' });\n        else this.setState({ signupPending: true, authError: '' });\n      });\n    } else {\n      this.supabase.auth.signInWithPassword({ email, password }).then(({ error }) => {\n        if (error) this.setState({ authError: error.message });\n      });\n    }\n  };\n  logout = () => { this.supabase.auth.signOut(); };\n\n  persistSettings(patch) {\n    this.setState(s => {\n      const next = { ...s, ...patch };\n      if (this.state.settingsRowId) {\n        this.supabase.from('settings').update({ clubs: next.clubs, club_distances: next.clubDistances, wedges: next.wedges }).eq('id', this.state.settingsRowId)\n          .then(({ error }) => { if (error) console.error('Settings save failed', error); });\n      } else if (this.userId) {\n        this.supabase.from('settings').insert({ user_id: this.userId, clubs: next.clubs, club_distances: next.clubDistances, wedges: next.wedges }).select().single()\n          .then(({ data, error }) => {\n            if (error) { console.error('Settings save failed', error); return; }\n            this.setState({ settingsRowId: data.id });\n          });\n      }\n      return patch;\n    });\n  }\n\n  goDashboard = () => this.setState({ view: 'dashboard', round: null, viewingRoundId: null });\n  goHistory = () => this.setState({ view: 'history' });\n  goSettings = () => this.setState({ view: 'settings' });\n  goStats = () => this.setState({ view: 'stats' });\n  goNotes = () => this.setState({ view: 'notes' });\n\n  onNotesDraftChange = (e) => this.setState({ notesDraft: e.target.value });\n  onNotesTitleChange = (e) => this.setState({ notesTitleDraft: e.target.value });\n  saveNote = () => {\n    const text = this.state.notesDraft.trim();\n    const title = this.state.notesTitleDraft.trim();\n    if (!text) return;\n    const uid = this.state.session.user.id;\n    const editingId = this.state.editingNoteId;\n    const date = new Date().toISOString();\n    if (editingId) {\n      this.setState(s => ({ notes: s.notes.map(n => n.id === editingId ? { ...n, title, text, date } : n), notesDraft: '', notesTitleDraft: '', editingNoteId: null }));\n      this.supabase.from('notes').update({ title, text, date }).eq('id', editingId)\n        .then(({ error }) => { if (error) { console.error('Note update failed', error); this.setState({ authError: 'Could not save note changes.' }); } });\n    } else {\n      const tempId = 'local-' + Date.now();\n      this.setState(s => ({ notes: [{ id: tempId, title, text, date }, ...s.notes], notesDraft: '', notesTitleDraft: '' }));\n      this.supabase.from('notes').insert({ user_id: uid, title, text, date }).select().single().then(({ data, error }) => {\n        if (error) { console.error('Note save failed', error); this.setState({ authError: 'Could not save note to your account: ' + error.message }); return; }\n        if (data) this.setState(s => ({ notes: s.notes.map(n => n.id === tempId ? { id: data.id, title: data.title, text: data.text, date: data.date } : n) }));\n      });\n    }\n  };\n  editNot
